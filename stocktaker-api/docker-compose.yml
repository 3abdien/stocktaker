services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocktaker
      POSTGRES_PASSWORD: stocktaker
      POSTGRES_DB: stocktaker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktaker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://stocktaker:stocktaker@db:5432/stocktaker
      JWT_SECRET: change-this-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:19006
    ports:
      - "8000:8000"

volumes:
  db_data:
